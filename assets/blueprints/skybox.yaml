shaders:
  - stage: vertex
    path: skybox.vert
  - stage: fragment
    path: skybox.frag
attachments:
  - format: r32g32b32a32_sfloat

blend_states:
  - src_color: src_alpha
    dst_color: one_minus_src_alpha
    color_op: add
    src_alpha: src_alpha
    dst_alpha: one_minus_src_alpha
    alpha_op: subtract
    color_mask: rgba
    enabled: true

depth_stencil:
  depth_test: false
  depth_write: false
vertex_input:
  bindings:
    - binding: 0
      stride: 12
      input_rate: vertex
  attributes:
    - location: 0
      binding: 0
      format: vec3
      offset: 0
msaa_samples: 1
